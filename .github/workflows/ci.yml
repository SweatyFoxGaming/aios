name: Phoenix OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust (Nightly)
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy, rustfmt, rust-src
        targets: x86_64-unknown-none

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Build Workspace (Bare Metal)
      run: cargo build --workspace --verbose

    - name: Run Host Tests
      run: cargo test -p common --target x86_64-unknown-linux-gnu --verbose

    - name: Build Kernel Tests
      run: cargo build -p kernel --tests --verbose

    - name: Clippy
      run: cargo clippy --workspace -- -D warnings

    - name: cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2

    - name: Generate Documentation
      run: cargo doc --workspace --no-deps

    - name: Build Release Artifacts
      run: cargo build --workspace --release

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: phoenix-kernel-release
        path: target/x86_64-unknown-none/release/kernel
