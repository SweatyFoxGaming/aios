[workspace]
resolver = "2"
members = [
    "kernel",
    "common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Phoenix OS Developers"]
license = "Apache-2.0"
repository = "https://github.com/phoenix-os/phoenix-os"
homepage = "https://github.com/phoenix-os/phoenix-os"
description = "A lightweight operating system optimized for low-end hardware."

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
manual_is_multiple_of = "allow"
used_underscore_items = "allow"
used_underscore_binding = "allow"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
